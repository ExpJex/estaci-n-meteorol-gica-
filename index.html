<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proyecto Estación Meteorológica Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      padding: 20px;
      text-align: center; /* Centra el título y otros elementos */
    }

    h2 {
      margin-bottom: 20px;
    }

    table {
      margin: 0 auto; /* ✅ Centra la tabla horizontalmente */
      width: 80%; /* ✅ Le da un ancho más controlado (puedes ajustarlo) */
      max-width: 800px; /* Límite máximo para pantallas grandes */
      border-collapse: collapse;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    th, td {
      border: 1px solid #555;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: rgba(0, 123, 255, 0.8);
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <h2>Estación Meteorológica Online</h2>
  <table id="tablaDatos">
    <thead>
      <tr>
        <th>Fecha y hora</th>
        <th>Temperatura</th>
        <th>Humedad</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="3">Cargando datos...</td></tr>
    </tbody>
  </table>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxkFeT3tror7GC9Mc7r5mTaFZuXDVGNcc81ZntS9w4tImF3NWuBRty7lxtxR728tH98/exec";

    async function cargarDatos() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const tbody = document.querySelector("#tablaDatos tbody");
        tbody.innerHTML = "";

        data.slice(-10).reverse().forEach(d => {
          const fila = `<tr>
            <td>${d.fecha}</td>
            <td>${d.temperatura}</td>
            <td>${d.humedad}</td>
          </tr>`;
          tbody.innerHTML += fila;
        });
      } catch (err) {
        document.querySelector("#tablaDatos tbody").innerHTML =
          `<tr><td colspan="3">Error al obtener datos</td></tr>`;
      }
    }

    setInterval(cargarDatos, 5000);
    cargarDatos();
  </script>
</body>
</html>
