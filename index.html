<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Estación Meteorológica Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('<a href="https://www.freepik.es/vector-gratis/fondo-conexion-red-estilo-gradiente_12893175.htm">Imagen de freepik</a>');
      background-size: cover;
      color: white;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0,0,0,0.6);
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #007bff;
    }
  </style>
</head>
<body>
  <h2>Estación Metereológica</h2>
  <table id="tablaDatos">
    <thead>
      <tr>
        <th>Fecha y hora</th>
        <th>Temperatura</th>
        <th>Humedad</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="3">Cargando datos...</td></tr>
    </tbody>
  </table>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxkFeT3tror7GC9Mc7r5mTaFZuXDVGNcc81ZntS9w4tImF3NWuBRty7lxtxR728tH98/exec";

    async function cargarDatos() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const tbody = document.querySelector("#tablaDatos tbody");
        tbody.innerHTML = "";

        data.slice(-10).reverse().forEach(d => {
          const fila = `<tr>
            <td>${d.fecha}</td>
            <td>${d.temperatura}</td>
            <td>${d.humedad}</td>
          </tr>`;
          tbody.innerHTML += fila;
        });
      } catch (err) {
        document.querySelector("#tablaDatos tbody").innerHTML =
          `<tr><td colspan="3">Error al obtener datos</td></tr>`;
      }
    }

    setInterval(cargarDatos, 5000);
    cargarDatos();
  </script>
</body>
</html>
